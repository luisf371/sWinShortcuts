# F-022: Windows CI gate — Release build + full test run + dependency advisory scans on every
# push/PR to main. Documented follow-ups (see IMPLEMENTATION_PLAN.md): pin actions by commit SHA;
# add `--locked-mode` restore once F-019a commits packages.lock.json; enforce (fail on) the vulnerable
# scan once the production graph regresses; add signing/SBOM/provenance when a release channel is
# defined. F-019b (xUnit v3) is now in place, clearing the previously-flagged test-only High advisories.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore sWinShortcuts.sln

      - name: Build (Release)
        run: dotnet build sWinShortcuts.sln -c Release --no-restore

      - name: Test (Release)
        run: dotnet test sWinShortcuts.sln -c Release --no-build

      # Informational (these commands exit 0 even on findings). The xUnit v3 migration (F-019b)
      # cleared the previously-flagged test-only High advisories; production graph remains clean.
      - name: Vulnerable package scan
        run: dotnet list sWinShortcuts.sln package --vulnerable --include-transitive

      - name: Deprecated package scan
        run: dotnet list sWinShortcuts.sln package --deprecated --include-transitive

  publish:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore sWinShortcuts.csproj

      - name: Publish standalone executable
        run: >
          dotnet publish sWinShortcuts.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false -o publish

      # Validates single-file codegen produced a non-trivial executable. The full GUI launch smoke
      # test (notably the SDK 10.0.202 folder-name-sensitive startup regression) cannot run headlessly
      # in CI and is performed locally from a path containing spaces before each release.
      - name: Verify single-file publish output
        shell: pwsh
        run: |
          $exe = "publish/sWinShortcuts.exe"
          if (-not (Test-Path $exe)) { throw "Expected publish output not found: $exe" }
          $len = (Get-Item $exe).Length
          if ($len -lt 1MB) { throw "Single-file exe unexpectedly small ($len bytes)" }
          Write-Host "Single-file exe OK: $len bytes"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag publish/sWinShortcuts.exe --clobber
          } else {
            gh release create $tag publish/sWinShortcuts.exe --target "${{ github.sha }}" --title "sWinShortcuts build ${{ github.run_number }}" --notes "Requires .NET 10 Desktop Runtime (x64)."
          }
